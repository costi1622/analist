name: Raportul de dimineață

# Pornește când raportul de dimineață (criptat pentru telefon) ajunge în repo și te anunță pe telefon.
# Raportul nu e citit aici: e criptat cu cheia telefonului. Se trimite doar „Raportul de dimineață e gata”.
on:
  push:
    branches: [main]
    paths: ['rapoarte/ultimul.enc']

permissions:
  contents: write

concurrency:
  group: analiza
  cancel-in-progress: false

jobs:
  anunta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ref: main = ultima versiune din repo în momentul pornirii (o analiză poate fi rulat între timp)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Anunță raportul
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          FCM_CONT: ${{ secrets.FCM_CONT }}
          APP_URL: https://costi1622.github.io/analist/
        run: node runner/anunta.js raport
      - name: Salvează că anunțul a fost trimis
        run: |
          git config user.name "analist-bot"
          git config user.email "analist-bot@users.noreply.github.com"
          git add date/
          git diff --cached --quiet && exit 0
          git commit -m "anunț raport $(date -u +%F)"
          git pull --rebase origin main
          git push
