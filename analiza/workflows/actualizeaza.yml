name: Actualizează analiza

# v0.46: versiunea nouă a analizei, dintr-o atingere în aplicație (Acasă → „Actualizează analiza”).
# Ia codul publicat pe site-ul aplicației (dosarul analiza/), verifică amprenta SHA-256 a fiecărui fișier și abia apoi
# îl pune în repo. Atinge doar runner/*.js și package.json: workflow-urile și datele (date/) nu se schimbă niciodată de aici.
on:
  workflow_dispatch:
    inputs:
      versiune:
        description: 'versiunea așteptată, de exemplu 0.46.0 (o trimite aplicația)'
        required: true
      sursa:
        description: 'adresa aplicației, de unde se ia codul'
        required: false
        default: 'https://costi1622.github.io/analist/'

permissions:
  contents: write

concurrency:
  group: analiza          # aceeași coadă cu analiza: nu se calcă una pe alta
  cancel-in-progress: false

jobs:
  actualizeaza:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # acțiunile sunt fixate la commit-uri exacte, ca în analiza.yml
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Descarcă, verifică și pune versiunea nouă
        env:
          VERSIUNE: ${{ github.event.inputs.versiune }}
          SURSA: ${{ github.event.inputs.sursa }}
        run: |
          set -euo pipefail
          [[ "$SURSA" =~ ^https://[a-z0-9-]+\.github\.io/[A-Za-z0-9._-]+/$ ]] || { echo "::error::Adresa aplicației nu e validă: $SURSA"; exit 1; }
          [[ "$VERSIUNE" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::Versiune nevalidă: $VERSIUNE"; exit 1; }
          node - <<'JS'
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const S = process.env.SURSA, V = process.env.VERSIUNE, cheie = `${V}-${process.env.GITHUB_RUN_ID}`;
          const ia = async u => { const r = await fetch(u, { redirect: 'error', cache: 'no-store' }); if (!r.ok) throw new Error(`${u} → HTTP ${r.status}`); return Buffer.from(await r.arrayBuffer()); };
          (async () => {
            const m = JSON.parse((await ia(`${S}analiza/versiune.json?v=${cheie}`)).toString('utf8'));
            if (m.versiune !== V) throw new Error(`Site-ul are încă versiunea ${m.versiune}, nu ${V}. GitHub Pages se actualizează în câteva minute: încearcă din nou.`);
            const voie = /^(runner\/[a-z0-9-]+\.js|package\.json)$/, noi = {};
            for (const [f, h] of Object.entries(m.fisiere || {})) {
              if (!voie.test(f) || !/^[0-9a-f]{64}$/.test(h)) throw new Error(`Fișier nepermis în versiune: ${f}`);
              const b = await ia(`${S}analiza/${f}?v=${cheie}`), s = crypto.createHash('sha256').update(b).digest('hex');
              if (s !== h) throw new Error(`Amprenta nu se potrivește pentru ${f}: nu pun nimic în repo.`);
              noi[f] = b;
            }
            if (!noi['runner/ruleaza.js'] || !noi['runner/analiza.js'] || !noi['runner/config.js']) throw new Error('Versiunea nu are fișierele de bază ale analizei.');
            if (!noi['runner/config.js'].toString('utf8').includes(`VERSION = '${V}'`)) throw new Error('config.js nu e din versiunea cerută.');
            // abia acum, când totul s-a verificat: scrie fișierele și șterge din runner/ ce nu mai face parte din versiune
            for (const [f, b] of Object.entries(noi)) fs.writeFileSync(f, b);
            for (const n of fs.readdirSync('runner')) if (n.endsWith('.js') && !noi['runner/' + n]) fs.rmSync(path.join('runner', n));
            const wf = Object.keys(m.workflows || {});
            console.log(`Analiza ${V}: ${Object.keys(noi).length} fișiere verificate și puse.${wf.length ? ' Workflow-urile (' + wf.join(', ') + ') se compară în aplicație.' : ''}`);
          })().catch(e => { console.log('::error::' + e.message); process.exit(1); });
          JS
      - name: Salvează în repo
        run: |
          git config user.name "analist-bot"
          git config user.email "analist-bot@users.noreply.github.com"
          git add runner/ package.json
          git diff --cached --quiet && { echo "Deja la zi."; exit 0; }
          git commit -m "analiza ${{ github.event.inputs.versiune }} (actualizare din aplicație)"
          git pull --rebase origin main
          git push
