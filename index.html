*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.2px}.brand svg{width:28px;height:28px;flex:none}.brand small{display:block;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.4px;margin-top:-2px}

.pill{display:none}.pill.off{display:inline-block;color:var(--warn)}

.stamp{color:var(--mut);font-size:12px;margin-left:auto;white-space:nowrap}
.brand>div{white-space:nowrap}@media (max-width:420px){.brand small{display:none}.hrow{gap:8px}}
.ib{width:40px;height:40px;border-radius:13px;border:1px solid transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 92%,#fff 8%),var(--panel)) padding-box,linear-gradient(160deg,color-mix(in srgb,var(--acc) 45%,transparent),color-mix(in srgb,var(--ink) 10%,transparent) 55%,color-mix(in srgb,var(--acc2) 35%,transparent)) border-box;box-shadow:0 6px 16px -10px rgba(0,0,0,.6),inset 0 1px 0 color-mix(in srgb,#fff 10%,transparent);display:grid;place-items:center;cursor:pointer;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}.ib:active{transform:scale(.9)}.ib.on{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}.ib.on .ico{stroke:var(--acc)}
.ico{width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}

.ib .ico{color:var(--acc)}
.ib.spin .ico{animation:spin .8s linear infinite}
#bset .ico{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}#bset:active .ico,#bset.on .ico{transform:rotate(90deg)}
#blk .toarta{transition:transform .25s ease;transform-origin:16px 11px}#blk.inchide .toarta{transform:translateY(2px)}#blk:active .toarta{transform:rotate(25deg)}
.sec h2{display:flex;align-items:center;gap:8px}

@keyframes sicIn{from{transform:scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.ib.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Navigare jos ===== */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;display:flex;justify-content:center;pointer-events:none;transform:translateZ(0)}
nav .in{position:relative;display:flex;width:100%;max-width:420px;padding:6px;border-radius:24px;pointer-events:auto;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
nav .ind{position:absolute;left:0;top:6px;bottom:6px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc2) 14%,transparent));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .35s cubic-bezier(.3,1.25,.5,1),width .35s;z-index:0}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer;position:relative;z-index:1;transition:color .2s}
nav .ico{width:23px;height:23px;stroke:currentColor;color:currentColor;transition:transform .2s}
nav button.on{color:var(--acc)}nav button.on .ico .f{opacity:.3}
nav button.pop .ico{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
nav button.pop .ico path:not(.f),nav button.pop .ico rect:not(.f),nav button.pop .ico circle:not(.f){stroke-dasharray:80;animation:draw .6s ease both}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18) translateY(-2px)}100%{transform:none}}
@keyframes draw{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
nav .dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--verifica);box-shadow:0 0 0 2px var(--panel);animation:puls 2s infinite}
@keyframes puls{0%{box-shadow:0 0 0 2px var(--panel),0 0 0 2px color-mix(in srgb,var(--verifica) 60%,transparent)}70%{box-shadow:0 0 0 2px var(--panel),0 0 0 9px transparent}100%{box-shadow:0 0 0 2px var(--panel),0 0 0 2px transparent}}
main{padding:14px 14px calc(var(--navh,84px) + 34px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;overflow-x:clip}
html,body{overflow-x:clip}
.al,.sub,.card p{overflow-wrap:anywhere}
.sheet{overflow-x:hidden}
/* ===== Componente ===== */
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 100%,#fff 2%),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 9px}

.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.hero{font-size:36px;font-weight:750;letter-spacing:-.5px;line-height:1.1;margin:4px 0 2px}

.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}.ink2{color:var(--ink2)}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* „Ce fac azi” */
.todo{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--k,var(--acc)) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--k,var(--acc)) 14%,var(--panel)),var(--panel) 60%)}

.todo p{margin:0;color:var(--ink2);font-size:14px}
.todo .acts{display:flex;gap:8px;margin-top:12px}
.btn{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--acc2)));color:var(--accInk);border:0;padding:12px 14px;border-radius:12px;font-weight:700;width:100%;cursor:pointer}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--verifica);color:#fff}
.btn+.btn{margin-top:8px}.acts .btn+.btn{margin-top:0}
/* avertizări */
.al{display:block;padding:11px 12px;border-radius:12px;background:var(--panel2);margin-bottom:7px;font-size:14px;color:var(--ink2);border-left:3px solid var(--warn)}
.al.err{border-left-color:var(--verifica)}.al.good{border-left-color:var(--opor)}
/* listă poziții */
.list{padding:0;overflow:hidden}
.pr{display:grid;grid-template-columns:1fr 70px auto;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;animation:rise .35s ease both}
.pr:last-child{border:0}.pr:active{background:var(--panel2)}
.pr .s{font-weight:750;font-size:15.5px;letter-spacing:.3px}.pr .n{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

.wb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--mut)}.wb i.over{background:var(--warn)}
.wb b{position:absolute;top:-3px;width:2px;height:11px;background:var(--ink);border-radius:1px}
main.dr{animation:inDr .22s ease}main.st{animation:inSt .22s ease}@keyframes inDr{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}@keyframes inSt{from{opacity:.4;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* grafice */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ro{display:flex;align-items:flex-end;gap:16px;min-height:36px;margin-bottom:8px}.ro .d{color:var(--mut);font-size:11.5px;min-width:46px;padding-bottom:2px}.ro.act .d{color:var(--acc);font-weight:700}
.ro .v{display:flex;flex-direction:column;gap:1px;min-width:0}.ro .k{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);white-space:nowrap}.ro .k i{width:10px;height:3px;border-radius:2px;display:inline-block}.ro b{font-size:15px;color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.leg i.d{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;margin:4px 0 2px}
.stack div{height:100%;min-width:2px}
.dv{display:grid;grid-template-columns:62px 1fr 58px;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.dv .t{position:relative;height:14px}.dv .t::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.dv .t i{position:absolute;top:2px;height:10px;border-radius:3px}

.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:14px}.kv>span:nth-child(odd){color:var(--mut)}.kv>span:nth-child(even){text-align:right}

ul.m{list-style:none;padding:0;margin:4px 0}ul.m li{padding:5px 0;font-size:14px;color:var(--ink2);border-bottom:1px dashed var(--line)}ul.m li:last-child{border:0}

.seg{display:flex;gap:4px;background:var(--panel2);border-radius:11px;padding:3px}

.dots{display:flex;justify-content:center;gap:5px;margin-top:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc);width:16px;border-radius:3px}
.pr{position:relative}.pr::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--t,transparent)}

/* butoanele brokerilor, în culorile lor */
.brks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.brk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;text-decoration:none;color:#fff;position:relative;overflow:hidden;transition:transform .15s;box-shadow:0 8px 20px -10px var(--b)}

/* setări: listă grupată */
.grp{padding:0;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:inherit;font:inherit}

.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px}
.it .ch{color:var(--mut);font-size:18px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--pos);border-color:var(--pos)}.sw.on::after{transform:translateX(18px);background:#fff}

/* fișa acțiunii */
.av{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:-.2px;color:#fff;flex:none;box-shadow:0 8px 18px -8px var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.st{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.st .ico{width:16px;height:16px;stroke:var(--mut);margin-bottom:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.tu{background:color-mix(in srgb,var(--acc) 10%,var(--panel2));border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.55;margin:4px 0 12px}
.cheie{display:flex;gap:10px;align-items:center;padding:12px 13px;border-radius:12px;border:1px solid color-mix(in srgb,var(--opor) 40%,transparent);background:color-mix(in srgb,var(--opor) 8%,transparent);font-weight:700;font-size:14.5px}

/* tranziții continue */
header{view-transition-name:hdr}nav{view-transition-name:nav}#sheet.on{view-transition-name:fisa}#veil.on{view-transition-name:val}
::view-transition-group(*){animation-duration:.4s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-group(avsel){animation-duration:.45s;z-index:5}
html[data-vt=dr]::view-transition-old(root){animation:vtIesSt .2s ease-in both}html[data-vt=dr]::view-transition-new(root){animation:vtVineDr .34s cubic-bezier(.2,.8,.2,1) both}
html[data-vt=st]::view-transition-old(root){animation:vtIesDr .2s ease-in both}html[data-vt=st]::view-transition-new(root){animation:vtVineSt .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtIesSt{to{opacity:0;transform:translateX(-28px)}}@keyframes vtIesDr{to{opacity:0;transform:translateX(28px)}}
@keyframes vtVineDr{from{opacity:0;transform:translateX(28px)}}@keyframes vtVineSt{from{opacity:0;transform:translateX(-28px)}}
html[data-vt=fisa]::view-transition-new(fisa){animation:vtSus .42s cubic-bezier(.2,.9,.25,1) both}html[data-vt=fisa]::view-transition-new(val){animation:vtApare .3s ease both}
