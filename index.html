<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Analist</title>
<style>
/* ===== Teme: întunecat (implicit) și luminos; „auto” urmează telefonul ===== */
:root{color-scheme:dark;
--bg:#0b0f14;--panel:#121820;--panel2:#18202a;--line:#222c38;--ink:#e7edf3;--ink2:#a9b6c4;--mut:#6f7d8c;--acc:#4c9aff;--accInk:#06121f;
--adauga:#2fbf71;--pastreaza:#8796a8;--nu_adauga:#e0a63a;--asteapta:#5aa0e5;--verifica:#ff6b6b;--reechilibreaza:#b18be8;--opor:#f2c94c;
--pos:#2fbf71;--neg:#ff6b6b;--warn:#e0a63a;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#1c2530;--shadow:0 10px 30px rgba(0,0,0,.45)}
:root[data-theme="light"]{color-scheme:light;
--bg:#f3f5f8;--panel:#ffffff;--panel2:#eef2f6;--line:#e1e6ed;--ink:#0d1520;--ink2:#3d4a5a;--mut:#6b7787;--acc:#2a78d6;--accInk:#fff;
--adauga:#128a4c;--pastreaza:#5d6b7c;--nu_adauga:#a86d00;--asteapta:#2a6fb8;--verifica:#c93a3a;--reechilibreaza:#7351c4;--opor:#a87b00;
--pos:#128a4c;--neg:#c93a3a;--warn:#a86d00;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--grid:#e9edf2;--shadow:0 10px 30px rgba(20,30,50,.15)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;
--bg:#f3f5f8;--panel:#ffffff;--panel2:#eef2f6;--line:#e1e6ed;--ink:#0d1520;--ink2:#3d4a5a;--mut:#6b7787;--acc:#2a78d6;--accInk:#fff;
--adauga:#128a4c;--pastreaza:#5d6b7c;--nu_adauga:#a86d00;--asteapta:#2a6fb8;--verifica:#c93a3a;--reechilibreaza:#7351c4;--opor:#a87b00;
--pos:#128a4c;--neg:#c93a3a;--warn:#a86d00;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--grid:#e9edf2;--shadow:0 10px 30px rgba(20,30,50,.15)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
/* ===== Antet ===== */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{font-weight:800;letter-spacing:2.5px;font-size:15px}.brand b{color:var(--acc)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.pill{display:none}.pill.off{display:inline-block;color:var(--warn)}
body.nolive nav,body.nolive #bref{display:none}
.stamp{color:var(--mut);font-size:12px;margin-left:auto}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.ib svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Navigare jos ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer;position:relative}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}nav button.on::before{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav .dot{position:absolute;top:3px;left:calc(50% + 7px);width:7px;height:7px;border-radius:50%;background:var(--verifica);box-shadow:0 0 0 2px var(--panel)}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
/* ===== Componente ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 9px}
.sec h2{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);margin:0;font-weight:700}
.sec a,.link{color:var(--acc);font-size:13px;font-weight:600;cursor:pointer;background:none;border:0;padding:0}
.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.hero{font-size:36px;font-weight:750;letter-spacing:-.5px;line-height:1.1;margin:4px 0 2px}
.hero small{font-size:18px;font-weight:600;color:var(--ink2);margin-left:4px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}.ink2{color:var(--ink2)}
.sub{color:var(--mut);font-size:12.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap;background:color-mix(in srgb,currentColor 13%,transparent);border:0;cursor:pointer}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.star{color:var(--opor)}
/* „Ce fac azi” */
.todo{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--k,var(--acc)) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--k,var(--acc)) 14%,var(--panel)),var(--panel) 60%)}
.todo .tag{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--k,var(--acc))}
.todo h3{font-size:20px;margin:6px 0 4px;line-height:1.25}
.todo p{margin:0;color:var(--ink2);font-size:14px}
.todo .acts{display:flex;gap:8px;margin-top:12px}
.btn{background:var(--acc);color:var(--accInk);border:0;padding:12px 14px;border-radius:12px;font-weight:700;width:100%;cursor:pointer}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--verifica);color:#fff}
.btn+.btn{margin-top:8px}.acts .btn+.btn{margin-top:0}
/* avertizări */
.al{display:block;padding:11px 12px;border-radius:12px;background:var(--panel2);margin-bottom:7px;font-size:14px;color:var(--ink2);border-left:3px solid var(--warn)}
.al.err{border-left-color:var(--verifica)}.al.good{border-left-color:var(--opor)}
/* listă poziții */
.list{padding:0;overflow:hidden}
.pr{display:grid;grid-template-columns:1fr 70px auto;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;animation:rise .35s ease both}
.pr:last-child{border:0}.pr:active{background:var(--panel2)}
.pr .s{font-weight:750;font-size:15.5px;letter-spacing:.3px}.pr .n{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wb{width:78px;height:5px;border-radius:3px;background:var(--panel2);position:relative;overflow:visible}
.wb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--mut)}.wb i.over{background:var(--warn)}
.wb b{position:absolute;top:-3px;width:2px;height:11px;background:var(--ink);border-radius:1px}
main.dr{animation:inDr .22s ease}main.st{animation:inSt .22s ease}@keyframes inDr{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}@keyframes inSt{from{opacity:.4;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* grafice */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ro{display:flex;align-items:flex-end;gap:16px;min-height:36px;margin-bottom:8px}.ro .d{color:var(--mut);font-size:11.5px;min-width:46px;padding-bottom:2px}.ro.act .d{color:var(--acc);font-weight:700}
.ro .v{display:flex;flex-direction:column;gap:1px;min-width:0}.ro .k{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);white-space:nowrap}.ro .k i{width:10px;height:3px;border-radius:2px;display:inline-block}.ro b{font-size:15px;color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.leg i.d{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;margin:4px 0 2px}
.stack div{height:100%;min-width:2px}
.dv{display:grid;grid-template-columns:62px 1fr 58px;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.dv .t{position:relative;height:14px}.dv .t::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.dv .t i{position:absolute;top:2px;height:10px;border-radius:3px}
/* tabele, kv */
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:14px}.kv>span:nth-child(odd){color:var(--mut)}.kv>span:nth-child(even){text-align:right}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px}
ul.m{list-style:none;padding:0;margin:4px 0}ul.m li{padding:5px 0;font-size:14px;color:var(--ink2);border-bottom:1px dashed var(--line)}ul.m li:last-child{border:0}
.term{background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted color-mix(in srgb,var(--acc) 70%,transparent);text-underline-offset:3px;cursor:help}
.q{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);color:var(--mut);font-size:11px;font-weight:700;margin-left:5px;cursor:help;background:none;padding:0;vertical-align:1px}
/* segmente */
.seg{display:flex;gap:4px;background:var(--panel2);border-radius:11px;padding:3px}
.seg button{flex:1;background:none;border:0;padding:8px 0;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:11px;border-radius:11px;font:inherit;margin:5px 0 10px}
/* foi (bottom sheets), două niveluri */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.veil.on{opacity:1;pointer-events:auto}
#veil2{z-index:22}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:10px 18px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s .3s;max-width:760px;margin:0 auto;box-shadow:var(--shadow)}
#sheet2{z-index:23}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.grab{width:42px;height:5px;background:var(--line);border-radius:3px;margin:2px auto 14px}
/* raport */
.rap h1,.rap h2,.rap h3{letter-spacing:0;color:var(--ink);font-size:17px;margin:20px 0 8px}.rap h1{font-size:22px;margin-top:4px}
.rap h2{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--acc)}
.rap p,.rap li{font-size:15px;color:var(--ink2);line-height:1.6}.rap ul{padding-left:18px}.rap b{color:var(--ink)}
/* diverse */
.empty{color:var(--mut);text-align:center;padding:36px 14px;font-size:14px}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:11px 13px;border-radius:12px;margin-bottom:12px;background:color-mix(in srgb,var(--asteapta) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--asteapta) 35%,var(--line));color:var(--ink2)}
.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
#ptr{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));z-index:9;transform:translate(-50%,-60px);transition:transform .2s;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
#ptr svg{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:2.2;stroke-linecap:round}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .2s;z-index:30;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#upd{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:12px;font-weight:600;display:none;box-shadow:var(--shadow);cursor:pointer}#upd.on{display:block}
footer{color:var(--mut);font-size:11.5px;text-align:center;padding:8px 20px 0}
code{font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:5px}
body.ascuns main,body.ascuns .sheet{visibility:hidden}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="brand">ANAL<b>IST</b></div><span class="pill" id="pill">…</span>
  <span class="stamp num" id="stare"></span>
  <button class="ib" id="bref" aria-label="Reîncarcă" onclick="reincarca(true)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button class="ib" id="blk" aria-label="Blochează" onclick="blocheaza();toast('Blocat.')"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  <button class="ib" aria-label="Setări" onclick="go('setari')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<div id="ptr"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></div>
<main id="v"></main>
<nav><div class="in">
  <button data-v="azi" class="on" onclick="go('azi')"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Azi</button>
  <button data-v="plan" onclick="go('plan')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-v="analiza" onclick="go('analiza')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analiză</button>
</div></nav>
<div class="veil" id="veil" onclick="closeSheet()"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="veil" id="veil2" onclick="closeSheet()"></div><div class="sheet" id="sheet2" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<button id="upd">Versiune nouă a aplicației · <b>Reîncarcă</b></button>
<input type="file" id="fimp" accept="application/json" style="display:none" onchange="importJurnal(this)">
<script>
const APP_VER = '0.12.0';
const KEY = 'analist_v1'; // localStorage e comun cu Nivelo pe același domeniu: chei separate
const ETI = {adauga:'Adaugă',pastreaza:'Păstrează',nu_adauga:'Nu mai adăuga',asteapta:'Așteaptă',verifica:'Verifică teza',reechilibreaza:'Reechilibrează'};
const ORD = {uita:0,cumpara:1,las:2};
// Ce vezi pe ecran: 3 stări. Motorul rămâne cu cele 6 semnale; explicația exactă e în fișa acțiunii.
const SEM = {cumpara:'Cumpără luna asta', las:'Las-o', uita:'Uită-te la ea'};
const SEMC = {cumpara:'--adauga', las:'--pastreaza', uita:'--verifica'};
const sumaPlan = () => { const c=Object.keys(SNAP?.planuri||{}).map(Number); return c.includes(S.suma)?S.suma:P().contributieTipica; };
const inPlan = sym => (SNAP?.planuri?.[sumaPlan()]||[]).find(l=>l.symbol===sym);
const sem = p => ['verifica','reechilibreaza'].includes(p.semnal) ? 'uita' : inPlan(p.symbol) ? 'cumpara' : 'las';
// Verdictul într-o propoziție, pentru fișa acțiunii.
function verdict(p){
  if (p.deVerificat) return `Date de verificat: ${SNAP.paza?.motiv||'mișcare neobișnuită'} Semnalele pentru ea au fost oprite azi.`;
  const l = inPlan(p.symbol);
  if (sem(p)==='uita') return p.atentie[0] || 'Verifică dacă motivul pentru care o ții mai e valabil.';
  const oz = intraValid() ? INTRA.pozitii.find(x=>x.symbol===p.symbol)?.oportunitate : null;
  if (oz) return `★ Azi: ${oz}${l?` E în planul lunii: ${l.suma} ${de(l.suma)}lei la ${l.broker}.`:''}`;
  if (l) return `E în planul lunii: ${l.suma} ${de(l.suma)}lei la ${l.broker}.${p.oportunitate?' Prețul e mai mic decât de obicei.':''}`;
  return ({ adauga:'Ar merita bani noi, dar luna asta au prioritate pozițiile mai departe de țintă.',
    pastreaza:'Totul e în regulă. Păstrezi ce ai, nu e nimic de făcut.',
    nu_adauga:p.atentie[0] || 'Are deja destul loc în portofoliu. Banii noi merg în altă parte.',
    asteapta:p.atentie[0] || 'Momentul nu e bun pentru cumpărat. Revino peste câteva săptămâni.' })[p.semnal] || '';
}
const ACT = {cumparat:'Am cumpărat',vandut:'Am vândut',ignorat:'Am ignorat semnalul',altceva:'Notă'};

// Tokenul, cheia de date, cheia privată a raportului, numele ntfy și jurnalul stau criptate cu parola ta
// (PBKDF2-SHA256, 600.000 de iterații → AES-256-GCM). Fără parolă, nimic nu se poate citi:
// nici de cineva cu telefonul în mână, nici de alte pagini de pe același domeniu (Nivelo etc.).
let V = null, VK = null, DK = null, PRIV = null, STARE = null; // seiful deschis, cheia lui, cheia de date, cheia privată
const ITER = 600000, SEIF = KEY+'_seif';
const are_seif = () => !!localStorage.getItem(SEIF);
const live = () => !!(V && V.token);
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const b64url = u => b64e(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64url = s => b64d(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4));
async function cheieParola(pw, sare, iter){
  const baza = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:sare, iterations:iter, hash:'SHA-256'}, baza, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function salveazaSeif(){
  const o = JSON.parse(localStorage.getItem(SEIF)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, VK, new TextEncoder().encode(JSON.stringify(V)));
  localStorage.setItem(SEIF, JSON.stringify({...o, iv:b64e(iv), ct:b64e(ct)}));
}
async function creeazaSeif(pw, continut){
  const sare = crypto.getRandomValues(new Uint8Array(16));
  VK = await cheieParola(pw, sare, ITER); V = continut;
  localStorage.setItem(SEIF, JSON.stringify({v:1, iter:ITER, sare:b64e(sare)}));
  await salveazaSeif(); await pregatesteChei();
}
async function deschideSeif(pw){
  const o = JSON.parse(localStorage.getItem(SEIF));
  const k = await cheieParola(pw, b64d(o.sare), o.iter);
  const txt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(o.iv)}, k, b64d(o.ct)); // aruncă eroare la parolă greșită
  VK = k; V = JSON.parse(new TextDecoder().decode(txt)); J = V.jurnal || []; await pregatesteChei();
}
async function pregatesteChei(){
  DK = await crypto.subtle.importKey('raw', unb64url(V.dataKey), 'AES-GCM', false, ['decrypt']);
  PRIV = V.priv ? await crypto.subtle.importKey('jwk', V.priv, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']) : null;
}
async function decDate(t){ if(!t) return null; const o=JSON.parse(t); return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(o.iv)}, DK, b64d(o.ct))); }
async function decRaport(t){
  if(!t||!PRIV) return null; const o=JSON.parse(t);
  const raw = await crypto.subtle.decrypt({name:'RSA-OAEP'}, PRIV, b64d(o.k));
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(o.iv)}, k, b64d(o.ct)));
}
async function perecheRaport(){
  const kp = await crypto.subtle.generateKey({name:'RSA-OAEP', modulusLength:3072, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256'}, true, ['encrypt','decrypt']);
  const spki = b64e(await crypto.subtle.exportKey('spki', kp.publicKey));
  return { priv: await crypto.subtle.exportKey('jwk', kp.privateKey), pub: `-----BEGIN PUBLIC KEY-----\n${spki.match(/.{1,64}/g).join('\n')}\n-----END PUBLIC KEY-----` };
}

// ===== Date: repo privat prin API-ul GitHub =====
const GH = 'https://api.github.com/repos/';
const ghErr = s => s===401?'Token GitHub greșit sau expirat.':s===403?'Tokenul nu are permisiunea necesară.':s===404?'Nu găsesc repo-ul sau fișierul.':'GitHub: HTTP '+s;
async function gh(path, opt={}) {
  const r = await fetch(GH+S.repo+path, {...opt, cache:'no-store', headers:{Authorization:'Bearer '+(opt.token||V?.token||''), Accept:opt.raw?'application/vnd.github.raw':'application/vnd.github+json', ...(opt.body?{'Content-Type':'application/json'}:{}), ...(opt.etag?{'If-None-Match':opt.etag}:{})}});
  if (opt.optional && r.status===404) return null;
  if (r.status===304) return {neschimbat:true};
  if (!r.ok) throw new Error(ghErr(r.status));
  if (opt.etag!==undefined) return {text:await r.text(), etag:r.headers.get('ETag')};
  return opt.raw ? r.text() : (r.status===204 ? null : r.json());
}
// Fișierele din repo, păstrate local cu ETag: dacă nu s-au schimbat, GitHub răspunde 304 și nu se descarcă nimic.

async function fisier(path){
  const c = FIS[path], r = await gh('/contents/'+path, {raw:true, optional:true, etag:c?.etag||''});
  if (r===null) { delete FIS[path]; return {text:null, schimbat:!!c}; }
  if (r.neschimbat) return {text:c.text, schimbat:false};
  FIS[path] = {etag:r.etag, text:r.text}; return {text:r.text, schimbat:true};
}

// ===== Grafice SVG (fără biblioteci) =====
const GR = {}; let grId = 0;
// series: [{name, v:[], color:'--s1', dash, w}], x: [date], h: [{v,color,label,dash}], fmt
function lineChart(o){
  const id='g'+(grId++); GR[id]=o; o.H=o.H||170;

}
// Praguri „rotunde” pe axă: pași de 1, 2, 2,5 sau 5 × 10^n.
function praguri(lo, hi, n=5){
  const brut=(hi-lo)/(n-1)||Math.abs(hi)||1, p10=Math.pow(10,Math.floor(Math.log10(brut)));
  const pas=[1,2,2.5,5,10].map(k=>k*p10).find(k=>k>=brut);
  const t0=Math.floor(lo/pas)*pas, out=[]; for(let v=t0; v<hi+pas*0.999; v+=pas) out.push(+v.toPrecision(12));
  return {t:out, pas};
}
function montaGrafice(){
  for (const [id,o] of Object.entries(GR)) {
    const el=$(id); if(!el){ delete GR[id]; continue; }
    const W=Math.max(el.clientWidth,260), H=o.H, pl=2, pr=46, pt=8, pb=22;
    const all=o.series.flatMap(s=>s.v).concat((o.h||[]).map(h=>h.v)).filter(x=>x!=null&&isFinite(x));
    if (!all.length) { el.innerHTML='<div class="sub">Date insuficiente.</div>'; continue; }
    const {t:ticks, pas} = praguri(Math.min(...all), Math.max(...all)), lo=ticks[0], hi=ticks[ticks.length-1];
    const fA = o.fmtAxa || (v => S.privat&&o.privat ? '•••' : nf(v, pas>=1?0:pas>=0.1?1:2));
    const n=o.series[0].v.length, X=i=>pl+(W-pl-pr)*(n<2?0:i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'grafic')}"><defs>${o.series.map((se,k)=>`<linearGradient id="${id}g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(${se.color});stop-opacity:.24"/><stop offset="1" style="stop-color:var(${se.color});stop-opacity:0"/></linearGradient>`).join('')}</defs>`;
    s+=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1" ${t===lo?'':'stroke-dasharray="2 4"'}/><text x="${W-pr+8}" y="${Y(t)+4}" fill="var(--mut)" font-size="10.5" class="num">${esc(fA(t))}</text>`).join('');
    if (o.x) { const mid=Math.floor((n-1)/2); s+=[[0,'start'],[mid,'middle'],[n-1,'end']].map(([i,a])=>`<text x="${X(i)}" y="${H-5}" fill="var(--mut)" font-size="10.5" text-anchor="${a}">${esc(ziRo(o.x[i],false))}</text>`).join(''); }
    for (const h of o.h||[]) if(h.v>=lo&&h.v<=hi) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(h.v)}" y2="${Y(h.v)}" stroke="var(${h.color})" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${pl+4}" y="${Y(h.v)-5}" fill="var(${h.color})" font-size="10.5" font-weight="600">${esc(h.eticheta||h.name)}</text>`;
    o.series.forEach((se,k)=>{
      let d='',on=false; se.v.forEach((v,i)=>{ if(v==null){on=false;return;} d+=(on?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); on=true; });
      if (k===0 && o.area) s+=`<path d="${d}L${X(n-1)} ${H-pb}L${X(0)} ${H-pb}Z" fill="url(#${id}g0)"/>`;
      s+=`<path d="${d}" fill="none" stroke="var(${se.color})" stroke-width="${se.w||2}" ${se.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    o.series.forEach((se,k)=>{ const li=se.v.length-1; if(se.v[li]!=null&&k===0) s+=`<circle cx="${X(li)}" cy="${Y(se.v[li])}" r="7" fill="var(${se.color})" opacity=".18"/><circle cx="${X(li)}" cy="${Y(se.v[li])}" r="3.6" fill="var(${se.color})" stroke="var(--panel)" stroke-width="1.6"/>`; });
    s+=`<line class="xh" y1="${pt}" y2="${H-pb}" stroke="var(--ink2)" stroke-width="1" opacity="0"/>${o.series.map((se,k)=>`<circle class="xd${k}" r="4.5" fill="var(${se.color})" stroke="var(--panel)" stroke-width="2" opacity="0"/>`).join('')}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/></svg>`;
    el.insertAdjacentHTML('beforeend', s);
    const svg=el.querySelector('svg'), ro=el.querySelector('.ro');
    const fV = v => S.privat&&o.privat ? '•••' : (o.fmt||nf)(v);
    const citire = i => ro.innerHTML = `<span class="d">${o.x?esc(ziRo(o.x[i],false)):''}</span>`+o.series.map(se=>`<span class="v"><span class="k"><i style="background:var(${se.color})${se.dash?';height:2px':''}"></i>${esc(se.short||se.name)}</span><b>${esc(fV(se.v[i]))}</b></span>`).join('');
    citire(n-1);
    const show=ev=>{
      const r=svg.getBoundingClientRect(), cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)*W/r.width;
      const i=Math.max(0,Math.min(n-1,Math.round((cx-pl)/(W-pl-pr)*(n-1)))), x=X(i);
      svg.querySelector('.xh').setAttribute('x1',x); svg.querySelector('.xh').setAttribute('x2',x); svg.querySelector('.xh').setAttribute('opacity','.45');
      o.series.forEach((se,k)=>{ const c=svg.querySelector('.xd'+k); if(se.v[i]==null){c.setAttribute('opacity','0');return;} c.setAttribute('cx',x); c.setAttribute('cy',Y(se.v[i])); c.setAttribute('opacity','1'); });
      citire(i); ro.classList.add('act');
    };
    const hide=()=>{ citire(n-1); ro.classList.remove('act'); svg.querySelector('.xh').setAttribute('opacity','0'); o.series.forEach((_,k)=>svg.querySelector('.xd'+k).setAttribute('opacity','0')); };
    svg.addEventListener('pointermove',show); svg.addEventListener('pointerdown',show); svg.addEventListener('pointerleave',hide);
    svg.addEventListener('touchmove',show,{passive:true}); svg.addEventListener('touchend',()=>setTimeout(hide,1400));
    delete GR[id];
  }
}

    return { ...p, valueRON:v, costRON:c, pnlRON:v-c, pnlPct:c?(v/c-1)*100:0, valueUSD:bs.every(b=>b.valueUSD!=null)?sum('valueUSD'):null, costUSD:bs.every(b=>b.costUSD!=null)?sum('costUSD'):null, peCont:true };
  });

  return { poz, total, cost, usd };

function md(t){
  const lines = esc(t).split('\n'); let h='', inUl=false;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--acc)">$1</a>');
  for (const l of lines) {
    const m = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*]\s+(.*)/);
    if (!li && inUl) { h+='</ul>'; inUl=false; }
    if (m) h += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;
    else if (li) { if(!inUl){h+='<ul>';inUl=true;} h += `<li>${inl(li[1])}</li>`; }
    else if (l.trim()) h += `<p>${inl(l)}</p>`;
  }
  return h + (inUl?'</ul>':'');
}

  const pasH = (n,k,t,body) => `<div class="card"><div class="row"><span class="lbl">Pasul ${n}</span>${k?bif(k):''}</div><h3 style="margin:4px 0 8px;font-size:18px">${t}</h3>${body}</div>`;
  return `<div class="sec" style="margin-top:6px"><h2>Pornire</h2><span class="sub">~15 minute, o singură dată</span></div>
  <div class="sub" style="margin:0 2px 12px">Aplicația pornește cu datele tale după pasul 3. Fiecare pas e explicat în detaliu în documentație.</div>
  ${pasH(1,'repo','Creează două repo-uri goale',`<div class="sub" style="margin-bottom:10px">Doar le creezi, fără fișiere. Codul îl publică Claude, după ce îi spui în chat că sunt create.</div>
    <div style="display:flex;gap:8px"><a class="btn ghost sm" style="flex:1;text-align:center;text-decoration:none" href="https://github.com/new?name=analist-date&visibility=private" target="_blank" rel="noopener">analist-date (privat) ↗</a>
    <a class="btn ghost sm" style="flex:1;text-align:center;text-decoration:none" href="https://github.com/new?name=analist&visibility=public" target="_blank" rel="noopener">analist (public) ↗</a></div>`)}
  ${pasH(2,'chei','Pune cheile în GitHub',`<div class="sub" style="margin-bottom:6px">Pentru fiecare cheie: New repository secret, apoi numele exact și valoarea. Atinge numele ca să-l copiezi.</div>
    <a class="btn ghost sm" style="display:block;text-align:center;text-decoration:none;margin-bottom:6px" href="https://github.com/${esc(R)}/settings/secrets/actions/new" target="_blank" rel="noopener">Deschide pagina de secrete ↗</a>
    ${SECRETE.map(([n,b,tip,cum,url])=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><div class="row"><button class="chip" style="color:var(--acc)" onclick="copiaza('${n}')">${n} ⧉</button><span class="sub" style="color:var(${tip==='obligatoriu'?'--neg':tip==='recomandat'?'--warn':'--mut'})">${tip}</span></div>
      <div class="sub" style="margin-top:4px">${esc(cum)} ${url?`<a href="${url}" target="_blank" rel="noopener" style="color:var(--acc)">Deschide ↗</a>`:''}</div>
      ${n==='NTFY_TOPIC'?(PORN().topic?`<div style="display:flex;gap:8px;margin-top:6px"><button class="btn ghost sm" style="flex:1" onclick="copiaza('${PORN().topic}')">${PORN().topic} ⧉</button><a class="btn ghost sm" style="text-decoration:none" href="https://ntfy.sh/${PORN().topic}" target="_blank" rel="noopener">Abonează-te ↗</a></div>`:`<button class="btn ghost sm" style="margin-top:6px" onclick="topicNou()">Generează un nume</button>`):''}
      ${n==='DATA_KEY'?(PORN().dataKey?`<button class="btn ghost sm num" style="margin-top:6px;width:100%;word-break:break-all;font-size:12.5px" onclick="copiaza('${PORN().dataKey}')">${PORN().dataKey} ⧉</button>${PORN().existenta?'<div class="sub pos" style="margin-top:4px">Cheie existentă, preluată. Nu o pune din nou în GitHub dacă e deja acolo.</div>':''}`
        :`<div style="display:flex;gap:8px;margin-top:6px"><button class="btn ghost sm" style="flex:1" onclick="cheieNoua()">Generează cheia de date</button></div>
          <details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Am deja o cheie de date (telefon nou)</summary><input id="fdk" autocomplete="off" placeholder="Cheia de date (43 de caractere)"><button class="btn ghost sm" onclick="cheieExistenta()">Folosește cheia</button></details>`):''}</div>`).join('')}`)}
  ${pasH(3,null,'Conectează telefonul',`<div class="sub">La crearea tokenului alegi:</div><ul class="m" style="font-size:13.5px"><li>Repository access: <b class="ink2">Only select repositories → analist-date</b></li><li>Permissions: <b class="ink2">Contents: Read-only</b> și <b class="ink2">Actions: Read and write</b></li><li>Expiration: <b class="ink2">1 an</b></li></ul><div class="sub">Tokenul nu poate citi alt repo și nu poate modifica fișiere.</div>
    <a class="btn ghost sm" style="display:block;text-align:center;text-decoration:none;margin:10px 0" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Creează tokenul ↗</a>
    <input id="ft" type="password" autocomplete="off" placeholder="Lipește tokenul aici (github_pat_…)">
    <details style="margin-bottom:8px"><summary class="sub" style="cursor:pointer">Alt repo decât ${esc(R)}?</summary><input id="fu" value="${esc(R)}"></details>
    <div class="sub" style="margin-top:6px">Alege o parolă pentru aplicație. Cu ea se criptează pe telefon tokenul, cheia de date și jurnalul. Minimum 8 caractere. O frază din câteva cuvinte e cea mai sigură.</div>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="Parola aplicației">
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Parola, încă o dată">
    <button class="btn" onclick="salveaza(true)">Conectează și testează</button>`)}
  ${aspect}${ver}`;
}
async function salveaza(test){
  const r=($('fu')?.value||S.repo).trim(), t=$('ft').value.trim();
  if (!t) { toast('Lipește tokenul întâi.'); return; }
  const pornire = !V;
  if (pornire) {
    const pw1=$('pw1').value, pw2=$('pw2').value, pr=PORN();
    if (!pr.dataKey) { toast('Generează întâi cheia de date (pasul 2).'); return; }
    if (pw1.length < 8) { toast('Parola trebuie să aibă minimum 8 caractere.'); return; }
    if (pw1 !== pw2) { toast('Parolele nu coincid.'); return; }
  }
  // tokenul se verifică înainte de orice salvare: unul greșit nu trebuie să te blocheze
  const r0 = S.repo; S.repo = r;
  try { await gh('', {token:t}); } catch(e) { S.repo=r0; vib(); toast(e.message.includes('găsesc') ? `Nu găsesc repo-ul ${r} cu acest token. Verifică „Only select repositories”.` : e.message); return; }
  if (r!==r0) { FIS={}; saveFIS(); SNAP=null; }
  save();
  if (pornire) {
    toast('Se generează cheile și se criptează seiful…');
    const pr = PORN(), kp = await perecheRaport();
    await creeazaSeif($('pw1').value, { token:t, dataKey:pr.dataKey, topic:pr.topic||'', priv:kp.priv, pub:kp.pub, jurnal:[] });
    localStorage.removeItem(KEY+'_pornire');
  } else { V.token = t; await salveazaSeif(); }
  stare();
  if (test) ruleaza(true); else reincarca().then(()=>go('azi'));
}
function deconecteaza(){
  openSheet(`<div class="grab"></div><h3 style="margin:0 0 8px">Deconectezi telefonul?</h3>
  <div class="sub" style="font-size:14px;line-height:1.6;margin-bottom:12px">Se șterg de pe telefon seiful, tokenul și datele salvate. Datele din GitHub rămân criptate. Pentru reconectare îți trebuie cheia de date.</div>
  <button class="btn red" onclick="stergeSeif()">Deconectează</button><button class="btn ghost" onclick="closeSheet()">Renunță</button>`);
}
async function ruleaza(test){
  try { vib(); if (test) { go('setari'); }
    const inainte = new Date(Date.now()-120000).toISOString(); // marjă pentru ceasul telefonului
    await gh('/actions/workflows/analiza.yml/dispatches',{method:'POST',body:JSON.stringify({ref:'main',inputs:test?{mod:'test',cheie:V.pub}:{mod:'zi'}})});
    toast(test?'Testez conexiunile. Durează în jur de un minut…':'Analiza a pornit. Durează în jur de un minut…');
    for (let i=0;i<30;i++) {
      await new Promise(r=>setTimeout(r,10000));
      const j = await gh('/actions/workflows/analiza.yml/runs?event=workflow_dispatch&per_page=1');
      const run = j.workflow_runs?.[0];
      if (run && run.created_at >= inainte.slice(0,19) && run.status==='completed') {
        await new Promise(r=>setTimeout(r,3000)); await reincarca();
        if (test || run.conclusion!=='success') { go('setari'); toast(run.conclusion==='success'?'Testul s-a terminat. Rezultatul e mai jos.':'O conexiune nu merge. Detaliile sunt mai jos.'); return; }
        go('azi'); toast('Analiză actualizată.'); return;
      }
    }
    toast('Încă rulează. Reîncarcă peste un minut.');
  } catch(e){ toast(e.message); }
}

// ===== Foi: trage în jos ca să închizi =====
['sheet','sheet2'].forEach(id=>{
  const sh=$(id); let y0=null, dy=0;
  sh.addEventListener('touchstart',e=>{ if(sh.scrollTop>0||e.target.closest('[data-noswipe],input,textarea')){y0=null;return;} y0=e.touches[0].clientY; dy=0; sh.style.transition='none'; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); if(dy>0) sh.style.transform=`translateY(${dy}px)`; },{passive:true});
  sh.addEventListener('touchend',()=>{ if(y0==null) return; sh.style.transition=''; sh.style.transform=''; if(dy>110){ vib(); closeSheet(); } y0=null; });
});

// ===== Gesturi: tragere pentru reîncărcare, glisare între tab-uri =====
(()=>{
  let x0=null,y0=null,pull=false,noSwipe=false;
  const sheetOn=()=>$('sheet').classList.contains('on');
  addEventListener('touchstart',e=>{ if(sheetOn()) return; const t=e.touches[0]; x0=t.clientX; y0=t.clientY; pull=scrollY<=0; noSwipe=!!e.target.closest('[data-noswipe],input,textarea'); },{passive:true});
  addEventListener('touchmove',e=>{ if(x0==null||!pull) return; const dy=e.touches[0].clientY-y0; if(dy>0) $('ptr').style.transform=`translate(-50%,${Math.min(dy*0.5,60)-60}px) rotate(${dy*2}deg)`; },{passive:true});
  addEventListener('touchend',e=>{
    if(x0==null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    $('ptr').style.transform='translate(-50%,-60px)';
    if(pull&&dy>110&&Math.abs(dx)<60) reincarca(true);
    else if(!noSwipe&&Math.abs(dx)>80&&Math.abs(dy)<45&&TABS.includes(VIEW)){ const i=TABS.indexOf(VIEW)+(dx<0?1:-1); if(i>=0&&i<TABS.length) go(TABS[i]); }
    x0=null;
  });
  // doar la schimbarea lățimii (rotire), nu la apariția tastaturii, care ar șterge ce scrii
  let w0=innerWidth; addEventListener('resize',()=>{ if(innerWidth===w0) return; w0=innerWidth; clearTimeout(window._rz); window._rz=setTimeout(render,200); });
})();

// Versiune nouă: noul service worker așteaptă; bara îl activează la cerere.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(reg=>{
  const arata = w => { $('upd').classList.add('on'); $('upd').onclick = () => { w.postMessage('activeaza'); }; };
  if (reg.waiting && navigator.serviceWorker.controller) arata(reg.waiting);
  reg.addEventListener('updatefound', () => { const w = reg.installing; w?.addEventListener('statechange', () => { if (w.state==='installed' && navigator.serviceWorker.controller) arata(w); }); });
  reg.update().catch(()=>{});
}).catch(()=>{});
let RELOADING=false; navigator.serviceWorker?.addEventListener('controllerchange',()=>{ if(!RELOADING){ RELOADING=true; location.reload(); } });
LOADED = !are_seif() ? true : LOADED;
render(); reincarca();
setInterval(()=>{ if(!document.hidden) stare(); }, 60e3);
</script>
